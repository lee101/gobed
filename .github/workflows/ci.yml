name: Hosted CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu:
    name: CPU Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify gofmt
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            fmt_out=$(gofmt -l $files)
            if [ -n "$fmt_out" ]; then
              echo "The following files need gofmt:" >&2
              echo "$fmt_out" >&2
              exit 1
            fi
          fi

      - name: Run CPU Test Suite
        run: ./scripts/ci/run_cpu_checks.sh
        shell: bash
